[project]
name = "docs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Viswa Marepalli", email = "reachvishm@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mkdocs-material>=9.7.7",
]

# Not a real package: only declares dependencies. Disable setuptools
# auto-discovery so `pip install .` (Cloudflare Pages) doesn't trip over
# site/, overrides/ and node_modules/.
[tool.setuptools]
py-modules = []
