site_name: Crosswind
site_description: Python SDKs that push Cloudflare Python Workers to their limits.
site_url: https://github.com
theme:
  name: material
  custom_dir: overrides
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  # Dark only: the site uses one solid #0f0f0f background everywhere
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - content.code.copy
    - navigation.sections

nav:
  - Home: index.md
  - Containers:
      - Getting started: containers/getting-started.md
      - Lifecycle: containers/lifecycle.md
      - Routing and scaling: containers/routing.md
      - Outbound traffic: containers/outbound-traffic.md
      - Examples: containers/examples.md
      - Container class: containers/container-class.md
      - Coming from TypeScript: containers/coming-from-typescript.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/pypi-version.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
