site_name: Crosswind
site_description: Python SDKs that push Cloudflare Python Workers to their limits.
site_url: https://github.com
theme:
  name: material
  custom_dir: overrides
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  # Dark only: the site uses one solid #0f0f0f background everywhere
  palette:
    scheme: slate
    primary: custom
    accent: custom

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
