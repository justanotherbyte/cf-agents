[project]
name = "wynd"
version = "0.2.0"
description = "Alternative to pywrangler for Crosswind"
readme = "README.md"
authors = [
    { name = "Viswa Marepalli", email = "reachvishm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "json-with-comments>=1.3.0",
]

[project.scripts]
wynd = "wynd.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["E", "W", "N", "I", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Narrow with isinstance or fix the type instead of casting."

[tool.pytest.ini_options]
addopts = ["-m", "not e2e"]
markers = ["e2e: runs real uv and the pinned Wrangler; needs Node.js and the network"]

[dependency-groups]
dev = [
    "crosswind-workers",
    "pytest>=9.1.1",
]

[tool.ty.src]
# The fixtures' packages exist only in the Pyodide installs their e2e tests
# make, and the typed fixture's env.py only once Wynd generates it.
exclude = ["tests/e2e/fastapi_worker", "tests/e2e/typed"]

[tool.uv.sources]
crosswind-workers = { path = "../crosswind-workers", editable = true }
