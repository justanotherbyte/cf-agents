[project]
name = "wynd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Viswa Marepalli", email = "reachvishm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "json-with-comments>=1.3.0",
]

[project.scripts]
wynd = "wynd.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["E", "W", "N", "I", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Narrow with isinstance or fix the type instead of casting."

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
