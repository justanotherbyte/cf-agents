[project]
name = "crosswind-workers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Viswa Marepalli", email = "reachvishm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is crosswind-workers, but workerd imports the SDK as `workers`.
module-name = ["workers", "_crosswind_patches"]
# Lands in site-packages itself, where Python runs .pth files at startup. The
# hook's name sorts after an editable install's crosswind_workers.pth, which
# must put src/ on the path first.
data = { purelib = "purelib" }

[tool.ruff.lint]
extend-select = ["E", "W", "N", "I", "TID251"]
# Stub names mirror workerd's JS helpers.
per-file-ignores."stubs/**" = ["N"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Narrow with isinstance or fix the type instead of casting."

[tool.pytest.ini_options]
addopts = ["-m", "not e2e"]
markers = ["e2e: runs wynd dev from ../wynd; needs uv, Node.js and the network"]

[tool.ty.environment]
# Stubs for modules only workerd provides. They stay out of the wheel.
extra-paths = ["stubs"]

[tool.ty.src]
# The entropy fixture's packages exist only in the Pyodide install its e2e
# test makes.
exclude = ["tests/e2e/entropy"]

[dependency-groups]
dev = [
    "pyodide-py>=0.27.8",
    "pytest>=9.1.1",
]
